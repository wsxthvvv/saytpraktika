services:
  web:
    build:
      context: .
      args:
        REACT_APP_TELEGRAM_URL: ${REACT_APP_TELEGRAM_URL:-}
        REACT_APP_MAX_CHAT_URL: ${REACT_APP_MAX_CHAT_URL:-}
        REACT_APP_LEAD_API_URL: ${REACT_APP_LEAD_API_URL:-/api/leads}
        REACT_APP_YANDEX_MAPS_API_KEY: ${REACT_APP_YANDEX_MAPS_API_KEY:-}
        REACT_APP_AUTH_PEPPER: ${REACT_APP_AUTH_PEPPER:-}
        REACT_APP_YANDEX_METRIKA_ID: ${REACT_APP_YANDEX_METRIKA_ID:-}
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
    restart: unless-stopped
